services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: team_awesome
    volumes:
      - ./sd2-db.sql:/docker-entrypoint-initdb.d/sd2-db.sql # Initializes your DB

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=secretpassword
      - DB_DATABASE=team_awesome
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules # Critical: prevents host from overwriting container modules
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db