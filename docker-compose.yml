services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=awesome_pass
      - DB_NAME=team_awesome_db
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=awesome_pass
      - MYSQL_DATABASE=team_awesome_db
    volumes:
      - ./sd2-db.sql:/docker-entrypoint-initdb.d/init.sql

  # --- NEW PHPMYADMIN BLOCK ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80" # Maps port 8080 on your local machine to phpMyAdmin
    environment:
      - PMA_HOST=db # Tells phpMyAdmin to look for the container named 'db'
      - MYSQL_ROOT_PASSWORD=awesome_pass
    depends_on:
      - db